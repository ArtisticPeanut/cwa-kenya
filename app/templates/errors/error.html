{% extends "base.html" %}
{% block title %}{{ code }} · {{ app_short_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:2rem auto;text-align:center;">
  <h1 style="font-size:3rem;margin:0;color:var(--terracotta);">{{ code }}</h1>
  <p class="lead" style="margin:.5rem auto;">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.home') }}">Return home</a>
</div>
{% endblock %}
